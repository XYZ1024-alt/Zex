[package]
name = "zex"
version = "0.1.0"
edition = "2024"
description = "A minimal AI agent harness core"
license = "MIT"

[lib]
name = "zex"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
blake2 = "0.10"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6.0"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "parsing"] }
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.0"
unicode-width = "0.2"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_FileSystem",
] }
